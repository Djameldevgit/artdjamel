<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/icon-web-01.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
   
    <!-- Meta tags PWA améliorés pour Djamel Art -->
    <meta name="theme-color" content="#2c5aa0" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Djamel Art">
    
    <meta
      name="description"
      content="Achetez des œuvres d'art uniques en ligne. Peintures originales, reproductions et créations exclusives par des artistes talentueux."
    />
    <!-- Langue arabe (optionnel, conservé pour la compatibilité) -->
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400..700&display=swap" rel="stylesheet">

    <!-- Icônes -->
    <link rel="apple-touch-icon" href="/icon-web-01.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
   
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />

    <!-- Polices et icônes -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    
    <!-- Préchargement critique -->
    <link rel="preload" href="/static/js/bundle.js" as="script">
    
    <title>Djamel Art</title>

    <style>
      /* Écran de chargement PWA */
      #pwa-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #2c5aa0 0%, #1e3a8a 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        transition: opacity 0.5s ease;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255,255,255,0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .pwa-standalone {
        padding-top: env(safe-area-inset-top);
      }
    </style>
  </head>
  <body>
    <!-- Écran de chargement PWA -->
    <div id="pwa-loading">
      <div class="loading-spinner"></div>
      <h4>Djamel Art</h4>
      <p>Chargement de Djamel Art...</p>
    </div>

    <noscript>
      <div class="alert alert-danger m-3">
        <h4>JavaScript requis</h4>
        <p>Vous devez activer JavaScript pour utiliser Djamel Art.</p>
      </div>
    </noscript>
    
    <div id="root"></div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>

    <!-- Script PWA (inchangé au niveau logique, seuls les commentaires sont adaptés) -->
    <script>
      // ==================== CONFIGURATION PWA STABILISÉE ====================
      console.log('🚀 Initialisation de la PWA Djamel Art...');
      
      // Variables globales
      window.deferredPrompt = null;
      window.isPWAInstalled = false;

      // 1. Cacher l'écran de chargement quand l'app est prête
      window.addEventListener('load', function() {
        console.log('📱 Page entièrement chargée');
        
        setTimeout(function() {
          const loading = document.getElementById('pwa-loading');
          if (loading) {
            loading.style.opacity = '0';
            setTimeout(() => {
              if (loading.parentNode) {
                loading.remove();
              }
            }, 500);
          }
        }, 800);
      });

      // 2. Fonction globale pour installer la PWA
      window.installPWA = function() {
        console.log('🔧 Exécution de installPWA...');
        
        if (window.deferredPrompt) {
          console.log('📲 Affichage de la demande d\'installation...');
          return window.deferredPrompt.prompt()
            .then(() => window.deferredPrompt.userChoice)
            .then((choiceResult) => {
              console.log('✅ Résultat:', choiceResult.outcome);
              
              if (choiceResult.outcome === 'accepted') {
                console.log('🎉 L\'utilisateur a accepté l\'installation');
                window.isPWAInstalled = true;
                localStorage.setItem('pwaInstalled', 'true');
                window.dispatchEvent(new Event('pwaInstalled'));
              } else {
                console.log('❌ L\'utilisateur a refusé l\'installation');
              }
              
              window.deferredPrompt = null;
              return choiceResult.outcome === 'accepted';
            })
            .catch((error) => {
              console.error('❌ Erreur dans installPWA:', error);
              window.deferredPrompt = null;
              return false;
            });
        } else {
          console.log('⚠️ Aucune demande d\'installation disponible');
          if (window.matchMedia('(display-mode: browser)').matches) {
            alert('Pour installer l\'application, utilisez le menu de votre navigateur et sélectionnez "Ajouter à l\'écran d\'accueil"');
          }
          return Promise.resolve(false);
        }
      };

      // 3. Capturer beforeinstallprompt
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('🎯 Événement beforeinstallprompt capturé!');
        e.preventDefault();
        window.deferredPrompt = e;
        localStorage.setItem('pwaInstallAvailable', 'true');
        window.dispatchEvent(new CustomEvent('pwaInstallAvailable'));
      });

      // 4. Détecter l'installation de la PWA
      window.addEventListener('appinstalled', (evt) => {
        console.log('🎉 PWA installée avec succès!');
        window.isPWAInstalled = true;
        window.deferredPrompt = null;
        localStorage.setItem('pwaInstalled', 'true');
        localStorage.removeItem('pwaInstallAvailable');
        window.dispatchEvent(new Event('pwaInstalled'));
      });

      // 5. Enregistrement du Service Worker (inchangé)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          console.log('🔧 Enregistrement du Service Worker...');
          
          const registerSW = () => {
            navigator.serviceWorker.register('/sw.js')
              .then(function(registration) {
                console.log('✅ SW enregistré correctement:', registration.scope);
                
                registration.addEventListener('updatefound', () => {
                  const newWorker = registration.installing;
                  console.log('🔄 Nouvelle version du SW trouvée:', newWorker.state);
                  
                  newWorker.addEventListener('statechange', () => {
                    console.log('📊 État du nouveau SW:', newWorker.state);
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('🆕 Nouveau contenu disponible, veuillez recharger.');
                    }
                  });
                });
              })
              .catch(function(error) {
                console.error('❌ Erreur d\'enregistrement du SW:', error);
              });
          };

          setTimeout(registerSW, 500);
        });

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          console.log('🔄 Contrôleur changé - mise à jour possible du SW');
        });
      }

      // 6. Vérifier l'état PWA au chargement
      window.addEventListener('DOMContentLoaded', function() {
        console.log('🔍 Vérification de l\'état PWA...');
        
        if (localStorage.getItem('pwaInstalled') === 'true') {
          window.isPWAInstalled = true;
        }
        
        if (window.matchMedia('(display-mode: standalone)').matches) {
          window.isPWAInstalled = true;
          localStorage.setItem('pwaInstalled', 'true');
          document.body.classList.add('pwa-standalone');
          console.log('📱 PWA détectée par le mode d\'affichage');
        }
      });

      // 7. Gestion des erreurs globales
      window.addEventListener('error', function(e) {
        console.error('🚨 Erreur globale capturée:', e.error);
      });

      console.log('✅ Configuration PWA terminée');
    </script>

  </body>
</html>
